# SpecHub 依赖版本目录 —— JVM 侧单一真源（P0 骨架重建 2026-11-14，产品方案 §0 四项决策）
# 原则：能交给 BOM 管的版本一律不在此自声明，避免「声明 X、实跑 Y」漂移（教训见 §0-3：JUnit 5.13.2 声明 vs 6.0.3 实跑）。
# 撤 Jackson 2 / swagger-parser（§0-1/§0-2）：此目录只出现 tools.jackson 3 坐标。

[versions]
# 对齐 spring-boot-dependencies 4.1.2 BOM（其 kotlin-stdlib / kotlin 插件一致，避免编译插件与 stdlib 漂移）
kotlin = "2.3.21"
# 当前 GA（Maven Central 2026-11-14 实测，锁定小版本）
springBoot = "4.1.2"
# tools.jackson BOM 版本：Boot 4.1.2 的 spring-boot-dependencies 同源 import 3.1.7，
# kernel（零 Spring）自声明 platform 以独立解析；两处一致则全局单版本。
jackson = "3.1.7"
sqliteJdbc = "3.54.1.0"

[libraries]
# ── Jackson 3 单运行时（tools.jackson，见记忆 spechub-jackson3-coords 实证坐标）──
jackson-bom      = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }  # platform，管以下全部
jackson-databind = { module = "tools.jackson.core:jackson-databind" }                 # JSON（JsonMapper）
jackson-yaml     = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }    # YAML（YAMLMapper）
jackson-kotlin   = { module = "tools.jackson.module:jackson-module-kotlin" }          # Kotlin data class

# ── SQLite 索引 ──
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

# ── 测试（JUnit 6.0.3 不在此自声明：由 spring-boot-dependencies BOM 提供）──
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }

# ── 平台 BOM ──
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }