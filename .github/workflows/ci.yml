name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers 使用 runner 预装 Docker；管理库矩阵由 -Dspechub.test.db 选择
      - name: Test against ${{ matrix.db }}
        run: ./gradlew test -Dspechub.test.db=${{ matrix.db }} --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.db }}
          path: |
            modules/**/build/reports/tests/**
            modules/**/build/test-results/**
          retention-days: 7

  build-image:
    name: bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build server jar
        run: ./gradlew :server:bootJar --no-daemon
