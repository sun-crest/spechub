name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure git identity (kernel/git-store tests)
        run: |
          git config --global user.name "SpecHub CI"
          git config --global user.email "ci@spechub.local"

      # check = ktlintCheck + verifyNoJackson2Usage + 全量 test（root build.gradle.kts 统一挂载）
      - name: Gradle check
        run: ./gradlew check --no-daemon
