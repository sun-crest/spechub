name: CI

# 只在发布 release 时执行双库矩阵（发布门禁）；日常开发用本地 ./gradlew check。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure git identity (kernel/git-store tests)
        run: |
          git config --global user.name "SpecHub CI"
          git config --global user.email "ci@spechub.local"

      # check = ktlintCheck + verifyNoJackson2Usage + 全量 test；管理库矩阵由 -Dspechub.test.db 选择
      - name: Gradle check against ${{ matrix.db }}
        run: ./gradlew check -Dspechub.test.db=${{ matrix.db }} --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.db }}
          path: |
            modules/**/build/reports/tests/**
            modules/**/build/test-results/**
          retention-days: 7

  build-image:
    name: bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build server jar
        run: ./gradlew :server:bootJar --no-daemon
