spring:
  application:
    name: spechub-server
  # Phase 2：管理库（PostgreSQL 默认 / MySQL 8.4 替代）；投影层 SQLite 不经 Spring DataSource
  datasource:
    url: ${SPECHUB_DB_URL:jdbc:postgresql://localhost:5432/spechub}
    username: ${SPECHUB_DB_USER:spechub}
    password: ${SPECHUB_DB_PASSWORD:spechub}
  flyway:
    locations: classpath:db/migration/{vendor}
    # 阶段 C 两阶段迁移：V6（身份 / 令牌 / 服务账号 / 审计，只加列与建表）在 C1 生效；
    # V7（删除 app_user.token_hash / is_platform_admin）与 C2–C4 代码同一发布窗口（C4 放开）。
    target: 7
  # 阶段 C：会话走 Spring Session Data Redis（dev / prod 同一实现，只换连接串）。
  data:
    redis:
      url: ${SPECHUB_REDIS_URL:redis://localhost:6379}
  session:
    timeout: 24h
    data:
      redis:
        namespace: spechub:session
        # 设备列表 / 按 principal 吊销需要 indexed repository
        repository-type: indexed
        cleanup-cron: "0 */15 * * * *"
  threads:
    virtual:
      # Java 25 虚拟线程（§7 选型：MVC 阻塞 + 虚拟线程，mock/调试请求的天然载体）
      enabled: true
  profiles:
    # 默认 dev（本地/最小部署鉴权关闭）；生产显式 SPRING_PROFILES_ACTIVE=prod
    default: dev

server:
  port: ${SPECHUB_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true

# R11 —— API 文档（Knife4j Next 5.x / springdoc 3.x）。enable 与公开性由 dev/prod profile 分别控制。
springdoc:
  api-docs:
    path: /v3/api-docs

knife4j:
  # 安全默认：不注册宽松 CORS；不启用 Insight 外联；关闭启动 banner（enable 在 profile 中设置）。
  cors: false
  banner: false
  insight:
    enable: false

spechub:
  # 三个数据目录默认值由 SpecHubProperties.defaultDir 提供（user.dir/.spechub/<name>）
  external-url: ${SPECHUB_EXTERNAL_URL:http://localhost:8080}
  gitea-url: ${SPECHUB_GITEA_URL:http://localhost:3000}
  polling-interval-ms: ${SPECHUB_POLLING_INTERVAL_MS:60000}
  default-branch: ${SPECHUB_DEFAULT_BRANCH:main}
  # C7：审计保留（天）与每日清理
  audit-retention-days: ${SPECHUB_AUDIT_RETENTION_DAYS:365}
  # C6：OIDC 单 IdP（Web 链 oauth2Login 的附加登录方式；enabled=false 时不注册任何 OIDC bean）
  oidc:
    enabled: ${SPECHUB_OIDC_ENABLED:false}
    registration-id: ${SPECHUB_OIDC_REGISTRATION_ID:spechub}
    issuer-uri: ${SPECHUB_OIDC_ISSUER_URI:}
    client-id: ${SPECHUB_OIDC_CLIENT_ID:}
    client-secret: ${SPECHUB_OIDC_CLIENT_SECRET:}
    scopes: ${SPECHUB_OIDC_SCOPES:openid,email,profile}
    redirect-uri: ${SPECHUB_OIDC_REDIRECT_URI:}
    auto-provision: ${SPECHUB_OIDC_AUTO_PROVISION:false}
    default-org-slug: ${SPECHUB_OIDC_DEFAULT_ORG_SLUG:default}
    email-claim: ${SPECHUB_OIDC_EMAIL_CLAIM:email}
    require-verified-email: ${SPECHUB_OIDC_REQUIRE_VERIFIED_EMAIL:true}
    authorization-uri: ${SPECHUB_OIDC_AUTHORIZATION_URI:}
    token-uri: ${SPECHUB_OIDC_TOKEN_URI:}
    jwk-set-uri: ${SPECHUB_OIDC_JWK_SET_URI:}
    user-info-uri: ${SPECHUB_OIDC_USER_INFO_URI:}
