spring:
  application:
    name: spechub-server
  threads:
    virtual:
      # Java 25 虚拟线程（§7 选型：MVC 阻塞 + 虚拟线程，mock/调试请求的天然载体）
      enabled: true

server:
  port: ${SPECHUB_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true