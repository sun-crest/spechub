# ── SpecHub 部署蓝图 v1（P0 骨架 · 2026-11-14）──
#
# 服务：gitea（默认内置文档仓托管，§7.1/§7.3）+ backend（Spring Boot 聚合层，含 mock 入口，不单列服务）
# 卷：gitsource（真源镜像仓 · gitsource/repos/<org>/<repo>）、gitea-data（内置 Gitea 数据）、
#     sqlite（索引 DB）、artifacts（导出/门户产物）—— 数据在命名卷，容器可重建、down 不丢；
#     SQLite 只是真源的可重建投影（§6.4 决策 7）。
#
# 约定：不用顶层 version 键（compose v2 已弃用）；端口/URL 由 .env 覆盖（见 compose/.env.example）。
# 注：backend build 阶段需访问依赖仓库（settings.gradle.kts 已配 Maven Central + 镜像兜底）。

name: spechub

services:

  gitea:
    # 默认内置的文档仓托管；切换外部 git 托管时停用此服务并改 backend 的 SPECHUB_GITEA_URL（§7.3）
    image: gitea/gitea:1.22
    container_name: spechub-gitea
    restart: unless-stopped
    environment:
      GITEA__server__ROOT_URL: ${SPECHUB_EXTERNAL_URL:-http://localhost:3000}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "22"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-true}
      # 跳过首启安装向导：INSTALL_LOCK 属 [security] 段（Gitea 实测，误写 [install] 会仍进安装页）；
      # 锁定后首次启动自动初始化 sqlite DB。admin 由后端 E8 用户引导种子
      GITEA__security__INSTALL_LOCK: "true"
      # webhook 只能投递到允许的 HTTP 服务（SSRF 防护）；默认 deny 非本机 → backend 收不到推送事件
      # 自托管场景放开私网（compose 服务名 backend + 172.x 网桥）投递
      GITEA__webhook__ALLOWED_HOST_LIST: ${GITEA_WEBHOOK_ALLOWED_HOSTS:-private}
    ports:
      - "${SPECHUB_GITEA_HTTP_PORT:-3000}:3000"
      - "${SPECHUB_GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: spechub-backend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: compose/backend/Dockerfile
    environment:
      # 三个数据卷挂载点（容器内路径；E1 的 `SPECHUB_*` 配置绑定认这份约定）
      SPECHUB_GIT_SOURCE_DIR: /var/lib/spechub/gitsource
      SPECHUB_SQLITE_DIR: /var/lib/spechub/sqlite
      SPECHUB_ARTIFACTS_DIR: /var/lib/spechub/artifacts
      # 对外 URL（用户浏览器）与内置 Gitea 地址（compose 网络内用服务名）
      SPECHUB_EXTERNAL_URL: ${SPECHUB_EXTERNAL_URL:-http://localhost:8080}
      SPECHUB_GITEA_URL: http://gitea:3000
    ports:
      - "${SPECHUB_PORT:-8080}:8080"
    volumes:
      - gitsource:/var/lib/spechub/gitsource
      - sqlite:/var/lib/spechub/sqlite
      - artifacts:/var/lib/spechub/artifacts
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gitsource:
  gitea-data:
  sqlite:
  artifacts: